name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
          POSTGRES_DB: hardware_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_user -d hardware_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://erp_user:erp_password@localhost:5432/hardware_erp_test?schema=public"
      DIRECT_URL: "postgresql://erp_user:erp_password@localhost:5432/hardware_erp_test?schema=public"
      NEXTAUTH_SECRET: "ci-only-secret-not-used-anywhere-else"
      NEXTAUTH_URL: "http://localhost:3001"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Gates removed during earlier development to unblock merges. They are
      # back: a build that does not typecheck must not be mergeable.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
